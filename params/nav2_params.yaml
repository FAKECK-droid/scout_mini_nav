bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    odom_topic: odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.1
      movement_time_allowance: 10.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.1
      stateful: true
    FollowPath:
      plugin: neupan_controller::NeupanController
      # Runtime tuning is supported; see README for the full list.
      # Initialization only: points_topic, dune_checkpoint, receding, step_time,
      # ipath.interval and pan.nrmp_max_num (cleanup/configure to change).
      points_topic: /cloud_registered_body
      pointcloud_timeout: 2.0
      # Height and XY range in robot_base_frame at the cloud's timestamp.
      min_obstacle_height: 0.05
      max_obstacle_height: 1.5
      min_obstacle_range: 0.0
      # Keep current points plus the 1 s horizon inside the model training range +/-5 m.
      max_obstacle_range: 3.5
      # Relative to this package's installed share directory on both WSL and Jetson.
      dune_checkpoint: /home/yan/ros2_ws/src/neupan_cpp/neupan_controller/models/scout_mini_waffle/scout_mini.bin
      receding: 10
      # A 1 s horizon at the same QP size; control still updates at 20 Hz.
      step_time: 0.1
      ref_speed: 0.5
      max_speed: [0.8, 1.0]   # [m/s, rad/s]
      max_acce: [1.0, 2.0]    # [m/s^2, rad/s^2]
      collision_threshold: 0.1
      rotate_to_goal_gain: 2.0
      ipath:
        interval: 0.05
        close_threshold: 0.1
        ind_range: 10
      pan:
        iter_num: 2
        dune_max_num: 100
        nrmp_max_num: 10
        iter_threshold: 0.1
      adjust:
        q_s: [1.0, 1.0, 1.0]
        # Favor forward progress over pursuing an unnecessarily large clearance.
        p_u: 2.0
        eta: 1.0
        d_max: 0.3
        d_min: 0.1
        ro_obs: 400.0
        bk: 0.1

# Humble controller_server creates this node even for a map-free controller.
local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.2
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.5
      update_frequency: 1.0
      publish_frequency: 1.0
      # The thin server entry point sets plugins/filters to typed empty arrays.
      # Do not put [] here: Humble may reject untyped empty YAML arrays.
      # EXACT training vertices/order for the bundled Scout model (0.627 x 0.549 m).
      footprint: "[[0.3135, 0.2745], [-0.3135, 0.2745], [-0.3135, -0.2745], [0.3135, -0.2745]]"
      footprint_padding: 0.0
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        # 与 global_costmap 一样使用二维射线清理，避免旧高度体素残留。
        footprint_clearing_enabled: true
        max_obstacle_height: 1.0
        observation_sources: scan
        scan:
          topic: /cloud_registered_body
          max_obstacle_height: 1.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      footprint: "[[0.3135, 0.2745], [-0.3135, 0.2745], [-0.3135, -0.2745], [0.3135, -0.2745]]"
      footprint_padding: 0.00
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /cloud_registered_body
          max_obstacle_height: 1.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: False
    # bringup 的 map_load_path 覆盖此项，必须是地图 YAML，不能是 PGM。
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.05
      use_astar: False
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

# robot_state_publisher:
#   ros__parameters:
#     use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 50.0  # 底盘 SDK 要求至少 50 Hz 的运动命令心跳
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.3, 0.0, 2.0]
    min_velocity: [-0.3, 0.0, -2.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "/odometry/filtered"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
