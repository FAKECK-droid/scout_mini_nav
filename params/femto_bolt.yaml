# Femto Bolt 导航默认配置：完整列出官方 femto_bolt.launch.py 的所有参数。
# launch 的 camera_* 参数覆盖对应项；use_sim_time 由导航总开关统一传入。
# 当前设备/1280x720 MJPG 15fps 的硬件 D2C profile 数为 0，使用 SDK 软件 D2C。
# enable_ir=false 仅关闭红外图像流；保留深度流、激光发射和深度解算。
# 深度采集 640x576，D2C 输出匹配彩色的 1280x720；单位按 Image.encoding/SDK 定义。
# *_exposure/gain 等 -1 为沿用设备默认值；滤波参数在对应开关 false 时不生效。
# 不改变官方驱动和独立标定/采集程序的默认配置。
driver_arguments:
  camera_name: camera
  depth_registration: true
  serial_number: ''
  usb_port: ''
  device_num: 1
  uvc_backend: libuvc
  product_id: ''
  enable_point_cloud: false
  cloud_frame_id: ''
  enable_colored_point_cloud: false
  point_cloud_qos: sensor_data
  connection_delay: 100
  color_width: 1280
  color_height: 720
  color_fps: 15
  color_format: MJPG
  enable_color: true
  color_flip: false
  color_qos: sensor_data
  color_camera_info_qos: default
  enable_color_auto_exposure: true
  color_ae_max_exposure: -1
  color_exposure: -1
  color_gain: -1
  color_brightness: -1
  enable_color_auto_white_balance: true
  color_white_balance: -1
  depth_width: 640
  depth_height: 576
  depth_fps: 15
  depth_format: Y16
  enable_depth: true
  depth_flip: false
  depth_qos: sensor_data
  depth_camera_info_qos: default
  ir_width: 640
  ir_height: 576
  ir_fps: 15
  ir_format: Y16
  enable_ir: false
  ir_flip: false
  ir_qos: sensor_data
  ir_camera_info_qos: default
  enable_ir_auto_exposure: true
  ir_ae_max_exposure: -1
  ir_exposure: -1
  ir_gain: -1
  ir_brightness: -1
  enable_sync_output_accel_gyro: false
  enable_accel: false
  accel_rate: 200hz
  accel_range: 4g
  enable_gyro: false
  gyro_rate: 200hz
  gyro_range: 1000dps
  linear_accel_cov: 0.01
  angular_vel_cov: 0.01
  publish_tf: true
  tf_publish_rate: 0.0
  ir_info_url: ''
  color_info_url: ''
  log_level: none
  log_file_name: ''
  enable_publish_extrinsic: false
  enable_d2c_viewer: false
  enable_ldp: true
  enable_noise_removal_filter: false
  enable_decimation_filter: false
  enable_spatial_filter: false
  enable_temporal_filter: false
  enable_hole_filling_filter: false
  enable_threshold_filter: false
  noise_removal_filter_min_diff: 10
  noise_removal_filter_max_size: 50
  decimation_filter_scale: -1
  spatial_filter_alpha: -1.0
  spatial_filter_diff_threshold: -1
  spatial_filter_magnitude: -1
  spatial_filter_radius: -1
  temporal_filter_diff_threshold: -1.0
  temporal_filter_weight: -1.0
  hole_filling_filter_mode: ''
  threshold_filter_max: -1
  threshold_filter_min: -1
  sync_mode: standalone
  enable_frame_sync: true
  depth_delay_us: 0
  color_delay_us: 0
  trigger2image_delay_us: 0
  trigger_out_delay_us: 0
  trigger_out_enabled: false
  ordered_pc: false
  enable_depth_scale: true
  align_mode: SW
  align_target_stream: COLOR
  laser_energy_level: -1
  enable_heartbeat: false
  time_domain: system
  device_preset: Custom
node_parameters:
  frame_aggregate_mode: full_frame
  diagnostic_period: 5.0
  # 与 /camera/color/image_raw 的真实畸变模型匹配，避免仅 K/尺寸相同而像素偏移。
  align_target_distortion: true
  enable_color_undistortion: false
  point_cloud_decimation_filter_factor: 1
  enable_laser: true
